[package]
name = "ironclaw_memory_ama_agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "AMA-Agent causality-graph memory provider for IronClaw Reborn (third-party provider lane; a Rust port of arXiv:2602.22769's reference memory system)"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[features]
default = []
# Exposes the deterministic stub LLM + hash embedder so downstream crates (e.g.
# the composition-level provider-swap test) can drive the provider with no
# network. Off by default so the stubs are not part of the production surface.
test-support = []

[dependencies]
# Internal IronClaw crates. Same substrates-layer boundary `ironclaw_memory_native`
# sits behind (it also takes `ironclaw_filesystem`), plus `ironclaw_llm` — which
# `ironclaw_embeddings`, another substrates crate, already depends on. Enforced by
# the architecture boundary test.
ironclaw_filesystem = { path = "../ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../ironclaw_host_api", version = "0.1.0" }
ironclaw_llm = { path = "../ironclaw_llm" }
ironclaw_memory = { path = "../ironclaw_memory", version = "0.1.0" }

# External crates (unrestricted by the boundary test, which only inspects
# `ironclaw_*` workspace edges).
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
# Self dev-dependency enables `test-support` for this crate's own integration
# tests in `tests/`, which import the stubs.
ironclaw_memory_ama_agent = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt"] }
